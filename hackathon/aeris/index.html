<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="web_dashboard" name="shell-type">
  <title>AERIS — Environmental Intelligence Platform</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <style>
    @layer base {
      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0a0e15; }
    ::-webkit-scrollbar-thumb { background: #263346; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #06B6D4; }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
  </style>

  <!-- Tailwind Theme Configuration matching Stitch design -->
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "background": "#0f131b",
            "surface-base": "#090D14",
            "surface-panel": "#0E141F",
            "surface-card": "#151D2A",
            "surface-container": "#1c2027",
            "surface-container-high": "#262a32",
            "surface-container-highest": "#31353d",
            "surface-container-lowest": "#0a0e15",
            "border-subtle": "#1E293B",
            "border-strong": "#263346",
            "telemetry-cyan": "#00E5FF",
            "precision-teal": "#06B6D4",
            "secondary": "#4cd7f6",
            "secondary-fixed": "#acedff",
            "baseline-emerald": "#10B981",
            "alert-amber": "#F59E0B",
            "alert-crimson": "#EF4444",
            "text-primary": "#F8FAFC",
            "text-muted": "#94A3B8",
            "text-dim": "#475569",
            "on-surface": "#dfe2ed",
            "on-surface-variant": "#bac9cc",
            "primary-container": "#00e5ff",
            "on-primary-container": "#00626e",
            "on-secondary-fixed": "#001f26",
            "on-error": "#690005"
          },
          fontFamily: {
            "body-lg": ["Inter", "sans-serif"],
            "body-md": ["Inter", "sans-serif"],
            "body-sm": ["Inter", "sans-serif"],
            "headline-xl": ["Inter", "sans-serif"],
            "headline-lg": ["Inter", "sans-serif"],
            "headline-md": ["Inter", "sans-serif"],
            "headline-sm": ["Inter", "sans-serif"],
            "label-lg": ["JetBrains Mono", "monospace"],
            "label-md": ["JetBrains Mono", "monospace"],
            "label-sm": ["JetBrains Mono", "monospace"],
            "telemetry-metric": ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Real Forecast Data from Python CSV Processor -->
  <script src="./data/forecastData.js"></script>
</head>
<body class="bg-surface-base font-body-md text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col">
  <div id="root"></div>

  <!-- Main React Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // Helper to format float values
    const fmt = (v) => (v !== undefined && v !== null ? Number(v).toFixed(1) : '--');

    // Safe color badge for category
    const getCatBadge = (cat, alert) => {
      if (alert === 'ALERT' || cat === 'Poor') {
        return {
          bg: 'bg-alert-crimson/15 text-alert-crimson border border-alert-crimson/30',
          dot: 'bg-alert-crimson',
          label: 'CRITICAL / POOR'
        };
      }
      if (alert === 'WATCH' || cat === 'Moderate') {
        return {
          bg: 'bg-alert-amber/15 text-alert-amber border border-alert-amber/30',
          dot: 'bg-alert-amber',
          label: 'ELEVATED / MODERATE'
        };
      }
      return {
        bg: 'bg-baseline-emerald/15 text-baseline-emerald border border-baseline-emerald/30',
        dot: 'bg-baseline-emerald',
        label: 'NOMINAL / GOOD'
      };
    };

    // AERIS Custom Logo Component
    function AerisLogo({ className = "h-7" }) {
      return (
        <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none">
          <g transform="translate(4, 4)">
            <circle cx="16" cy="16" r="14" stroke="#00E5FF" strokeWidth="1.75" strokeOpacity="0.35" strokeDasharray="2 3"/>
            <circle cx="16" cy="16" r="10" stroke="#00E5FF" strokeWidth="2" strokeOpacity="0.8"/>
            <circle cx="16" cy="16" r="4.5" fill="#00E5FF"/>
            <path d="M16 2 L16 7 M16 25 L16 30 M2 16 L7 16 M25 16 L30 16" stroke="#00E5FF" strokeWidth="1.5" strokeLinecap="round"/>
            <path d="M24 8 L20 12 M8 24 L12 20" stroke="#38BDF8" strokeWidth="1.2" strokeLinecap="round" strokeOpacity="0.7"/>
          </g>
          <text x="44" y="23" fill="#FFFFFF" fontFamily="Inter, sans-serif" fontWeight="800" fontSize="15" letterSpacing="2.5">AERIS</text>
          <text x="44" y="32" fill="#94A3B8" fontFamily="Inter, sans-serif" fontWeight="500" fontSize="6.8" letterSpacing="1.2">AIR INTELLIGENCE &amp; RESPONSE</text>
        </svg>
      );
    }

    // Main App Shell
    function App() {
      const rawData = window.FORECAST_DATA || { national: {}, regional: {} };
      
      const [scope, setScope] = useState('national'); // 'national' | 'regional'
      const [activeTab, setActiveTab] = useState('overview'); // overview, forecast, map, alerts, interventions, model
      const [selectedCityName, setSelectedCityName] = useState('Delhi');
      const [pollutant, setPollutant] = useState('pm25'); // 'pm25' | 'pm10' | 'aqi'
      const [timeHorizon, setTimeHorizon] = useState('24h'); // '6h' | '12h' | '24h'
      const [hoveredPoint, setHoveredPoint] = useState(null);
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [scrubberHour, setScrubberHour] = useState(14); // 0..23
      const [isPlaying, setIsPlaying] = useState(false);
      const [acknowledgedAlerts, setAcknowledgedAlerts] = useState({});
      const [showConstraintModal, setShowConstraintModal] = useState(false);
      const [notificationToast, setNotificationToast] = useState(null);

      // Cities in current scope
      const currentScopeCities = useMemo(() => {
        return rawData[scope] || {};
      }, [rawData, scope]);

      // Active City object
      const currentCity = useMemo(() => {
        if (currentScopeCities[selectedCityName]) {
          return currentScopeCities[selectedCityName];
        }
        // Fallback to first available city in scope
        const keys = Object.keys(currentScopeCities);
        if (keys.length > 0) {
          return currentScopeCities[keys[0]];
        }
        return null;
      }, [currentScopeCities, selectedCityName]);

      // All cities sorted by peak PM2.5 for hotspot analysis
      const rankedHotspots = useMemo(() => {
        const list = Object.values(currentScopeCities);
        return list.sort((a, b) => b.peak_pm25 - a.peak_pm25);
      }, [currentScopeCities]);

      // Total count of critical alerts across active scope
      const totalAlertsCount = useMemo(() => {
        let count = 0;
        Object.values(currentScopeCities).forEach(c => {
          if (c.primary_alert === 'ALERT') count++;
        });
        return count;
      }, [currentScopeCities]);

      // Time Scrubber Animation
      useEffect(() => {
        let timer;
        if (isPlaying) {
          timer = setInterval(() => {
            setScrubberHour(prev => (prev + 1) % 24);
          }, 1200);
        }
        return () => clearInterval(timer);
      }, [isPlaying]);

      // Switch scope handler
      const handleScopeChange = (newScope) => {
        setScope(newScope);
        const newCities = rawData[newScope] || {};
        const keys = Object.keys(newCities);
        if (!newCities[selectedCityName] && keys.length > 0) {
          setSelectedCityName(keys[0]);
        }
      };

      // Toast notification helper
      const triggerToast = (msg) => {
        setNotificationToast(msg);
        setTimeout(() => setNotificationToast(null), 3500);
      };

      // Re-run Inversion button simulation
      const handleRerunInversion = () => {
        setIsRefreshing(true);
        setTimeout(() => {
          setIsRefreshing(false);
          triggerToast("Inversion converged successfully: Assimilated 142/146 surface BAM stations.");
        }, 1200);
      };

      // Export CSV of currently active city
      const handleExportCSV = () => {
        if (!currentCity) return;
        const headers = "time,pm25_pred,pm10_pred,cat,alert,suggestions,p90_lower,p90_upper\n";
        const rows = currentCity.hourly.map(h => 
          `${h.time},${h.pm25},${h.pm10},${h.cat},${h.alert},"${h.suggestions}",${h.p90_lower},${h.p90_upper}`
        ).join("\n");
        const blob = new Blob([headers + rows], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `AERIS_${currentCity.name}_24h_forecast.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        triggerToast(`Exported 24H forecast for ${currentCity.name}`);
      };

      if (!currentCity) {
        return <div className="p-8 text-center text-telemetry-cyan font-label-md">Loading AERIS telemetry data...</div>;
      }

      return (
        <div className="min-h-screen flex flex-col bg-surface-base text-on-surface">
          {/* TOAST NOTIFICATION */}
          {notificationToast && (
            <div className="fixed top-14 right-6 z-50 bg-surface-panel border border-telemetry-cyan text-text-primary px-4 py-2.5 rounded shadow-2xl flex items-center gap-2 font-label-sm text-xs animate-bounce">
              <span className="material-symbols-outlined text-sm text-telemetry-cyan">info</span>
              <span>{notificationToast}</span>
            </div>
          )}

          {/* 1. SIDEBAR */}
          <aside className="fixed left-0 top-0 h-screen w-[230px] bg-surface-panel border-r border-border-subtle z-50 flex flex-col justify-between select-none">
            <div className="flex flex-col flex-1 min-h-0">
              {/* Branding Header */}
              <div className="h-12 px-3 flex items-center gap-2 border-b border-border-subtle shrink-0">
                <AerisLogo className="h-6 w-auto" />
              </div>

              {/* Active Sector / Scope Selector */}
              <div className="px-3 py-2 border-b border-border-subtle shrink-0 bg-surface-base/40">
                <div className="flex items-center justify-between mb-1">
                  <span className="font-label-sm text-[9px] text-text-muted uppercase tracking-wider">Atmospheric Scope</span>
                  <span className="font-label-sm text-[9px] text-telemetry-cyan font-bold uppercase">
                    {scope === 'national' ? 'NATIONAL (14)' : 'REGIONAL (7)'}
                  </span>
                </div>
                
                {/* Scope Toggle Buttons */}
                <div className="grid grid-cols-2 gap-1 mb-2">
                  <button 
                    onClick={() => handleScopeChange('national')}
                    className={`py-1 text-[10px] font-label-sm font-semibold rounded border transition-all ${
                      scope === 'national' 
                        ? 'bg-surface-card border-telemetry-cyan text-telemetry-cyan' 
                        : 'bg-surface-base/80 border-border-subtle text-text-muted hover:text-text-primary'
                    }`}
                  >
                    National (14)
                  </button>
                  <button 
                    onClick={() => handleScopeChange('regional')}
                    className={`py-1 text-[10px] font-label-sm font-semibold rounded border transition-all ${
                      scope === 'regional' 
                        ? 'bg-surface-card border-telemetry-cyan text-telemetry-cyan' 
                        : 'bg-surface-base/80 border-border-subtle text-text-muted hover:text-text-primary'
                    }`}
                  >
                    Hotspots (7)
                  </button>
                </div>

                {/* City Picker Dropdown */}
                <div className="relative">
                  <select 
                    value={selectedCityName} 
                    onChange={(e) => setSelectedCityName(e.target.value)}
                    className="w-full appearance-none bg-surface-base border border-border-strong rounded px-2.5 py-1 text-xs text-text-primary font-label-sm cursor-pointer hover:border-telemetry-cyan focus:outline-none focus:border-telemetry-cyan pr-6"
                  >
                    {Object.keys(currentScopeCities).map(cName => {
                      const c = currentScopeCities[cName];
                      return (
                        <option key={cName} value={cName} className="bg-surface-panel text-text-primary">
                          {cName} ({c.primary_alert === 'ALERT' ? '🔴 ALERT' : c.primary_alert === 'WATCH' ? '🟡 WATCH' : '🟢 OK'})
                        </option>
                      );
                    })}
                  </select>
                  <span className="material-symbols-outlined absolute right-1.5 top-1.5 text-xs text-text-muted pointer-events-none">unfold_more</span>
                </div>
              </div>

              {/* Navigation Menu */}
              <div className="flex-1 overflow-y-auto px-2 py-2 space-y-0.5">
                <div className="px-2 py-1 font-label-sm text-[9px] text-text-dim uppercase tracking-wider font-semibold">
                  Environmental Navigation
                </div>
                <nav className="space-y-0.5">
                  {[
                    { id: 'overview', label: 'Overview', icon: 'grid_view', badge: 'ACTIVE', badgeColor: 'text-baseline-emerald' },
                    { id: 'forecast', label: '24H Forecast', icon: 'timeline', badge: 'BAYES', badgeColor: 'text-text-muted' },
                    { id: 'map', label: 'Geo Map', icon: 'layers', badge: 'GIS', badgeColor: 'text-precision-teal' },
                    { id: 'alerts', label: 'Alerts', icon: 'warning', badge: totalAlertsCount.toString(), badgeColor: 'bg-alert-crimson/20 border border-alert-crimson/40 text-alert-crimson px-1.5 py-0.2 rounded font-bold' },
                    { id: 'interventions', label: 'Interventions', icon: 'policy', badge: '4 ACT', badgeColor: 'text-text-dim' },
                    { id: 'model', label: 'Model Intelligence', icon: 'memory', badge: 'PINN', badgeColor: 'text-precision-teal' }
                  ].map(tab => {
                    const isActive = activeTab === tab.id;
                    return (
                      <button
                        key={tab.id}
                        onClick={() => setActiveTab(tab.id)}
                        className={`w-full flex items-center justify-between px-2.5 py-1.5 rounded text-xs transition-all text-left ${
                          isActive 
                            ? 'bg-surface-card text-telemetry-cyan border border-telemetry-cyan/50 font-semibold' 
                            : 'text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface border border-transparent'
                        }`}
                      >
                        <div className="flex items-center gap-2">
                          <span className="material-symbols-outlined text-base">{tab.icon}</span>
                          <span className="font-body-md text-xs">{tab.label}</span>
                        </div>
                        <span className={`font-label-sm text-[9px] ${tab.badgeColor}`}>
                          {tab.badge}
                        </span>
                      </button>
                    );
                  })}
                </nav>
              </div>
            </div>

            {/* Sidebar Footer */}
            <div className="border-t border-border-subtle bg-surface-container-lowest p-2 shrink-0 space-y-2">
              <div className="p-1.5 bg-surface-panel border border-border-subtle rounded space-y-1">
                <div className="flex items-center justify-between">
                  <span className="font-label-sm text-[9px] text-text-muted uppercase">SYSTEM HEALTH</span>
                  <div className="flex items-center gap-1.5">
                    <span className="w-1.5 h-1.5 rounded-full bg-baseline-emerald animate-pulse"></span>
                    <span className="font-label-sm text-[9px] text-baseline-emerald font-semibold">NOMINAL</span>
                  </div>
                </div>
                <div className="flex items-center justify-between font-label-sm text-[9px] pt-1 border-t border-border-subtle/60 text-text-dim">
                  <span>DATA STREAM SYNC</span>
                  <span className="text-telemetry-cyan font-medium">100% (42ms)</span>
                </div>
              </div>
              <div className="flex items-center justify-between pt-0.5">
                <div className="flex items-center gap-2 overflow-hidden">
                  <div className="w-7 h-7 rounded-full bg-surface-container-highest border border-border-strong flex items-center justify-center font-label-sm text-xs font-bold text-telemetry-cyan">
                    AT
                  </div>
                  <div className="flex flex-col min-w-0">
                    <span className="font-body-sm text-[11px] leading-tight text-text-primary font-medium truncate">Dr. Aris Thorne</span>
                    <span className="font-label-sm text-[9px] leading-tight text-text-muted truncate">Director of Air Quality</span>
                  </div>
                </div>
                <button className="text-text-muted hover:text-on-surface transition-colors p-1" title="Settings">
                  <span className="material-symbols-outlined text-base">settings</span>
                </button>
              </div>
            </div>
          </aside>

          {/* 2. MAIN CONTENT WRAPPER */}
          <div className="pl-[230px] flex flex-col flex-1 min-w-0">
            {/* COMPACT GLOBAL TOP HEADER */}
            <header className="h-11 bg-surface-panel/95 backdrop-blur-md border-b border-border-subtle z-40 px-3 flex items-center justify-between shrink-0">
              <div className="flex items-center gap-3 min-w-0">
                <div className="flex items-center gap-1.5 font-label-md text-xs font-semibold text-text-primary tracking-wide shrink-0">
                  <span className="text-telemetry-cyan font-bold tracking-wider">AERIS</span>
                  <span className="text-text-dim">|</span>
                  <span className="text-on-surface-variant font-medium">Environmental Intelligence Platform</span>
                </div>
                <div className="h-3 w-px bg-border-subtle hidden md:block"></div>
                <div className="flex items-center gap-1 text-text-muted font-label-sm text-xs truncate">
                  <span className="material-symbols-outlined text-xs text-precision-teal">near_me</span>
                  <span className="text-text-dim uppercase text-[10px]">Location:</span>
                  <span className="text-text-primary font-medium truncate">{currentCity.name} ({currentCity.state})</span>
                </div>
                <div className="h-3 w-px bg-border-subtle hidden lg:block"></div>
                <div className="hidden lg:flex items-center gap-1.5 px-2 py-0.5 bg-surface-base border border-border-subtle rounded text-label-sm text-[10px]">
                  <span className="w-1.5 h-1.5 rounded-full bg-baseline-emerald"></span>
                  <span className="text-text-primary font-medium">LIVE MODEL SYNC · 42s AGO</span>
                  <span className="text-alert-amber font-semibold ml-1 bg-alert-amber/15 px-1 py-0.2 rounded">[PINN PREDICTIVE]</span>
                </div>
              </div>

              {/* Header Actions */}
              <div className="flex items-center gap-2 shrink-0">
                <div className="flex items-center gap-1 px-2 py-0.5 bg-baseline-emerald/10 border border-baseline-emerald/30 text-baseline-emerald rounded font-label-sm text-[10px] font-semibold">
                  <span className="w-1.5 h-1.5 rounded-full bg-baseline-emerald"></span>
                  <span>SYSTEM NOMINAL</span>
                </div>
                <button 
                  onClick={() => setActiveTab('alerts')}
                  className="relative p-1 text-text-muted hover:text-text-primary transition-colors" 
                  title="Notifications"
                >
                  <span className="material-symbols-outlined text-lg">notifications</span>
                  {totalAlertsCount > 0 && (
                    <span className="absolute top-0.5 right-0.5 w-1.5 h-1.5 bg-alert-crimson rounded-full animate-ping"></span>
                  )}
                </button>
                <button 
                  onClick={handleExportCSV}
                  className="flex items-center gap-1 px-2 py-1 bg-surface-card hover:bg-surface-container-high text-telemetry-cyan border border-border-strong hover:border-telemetry-cyan/60 rounded text-label-sm text-[10px] font-semibold transition-all"
                >
                  <span className="material-symbols-outlined text-xs">download</span>
                  <span>EXPORT CSV</span>
                </button>
              </div>
            </header>

            {/* TAB VIEWS */}
            <main className="flex-1 bg-surface-base p-3 space-y-3 overflow-x-hidden">
              {activeTab === 'overview' && (
                <OverviewView 
                  city={currentCity}
                  allHotspots={rankedHotspots}
                  pollutant={pollutant}
                  setPollutant={setPollutant}
                  timeHorizon={timeHorizon}
                  setTimeHorizon={setTimeHorizon}
                  isRefreshing={isRefreshing}
                  onRerun={handleRerunInversion}
                  onSelectCity={setSelectedCityName}
                  onOpenConstraint={() => setShowConstraintModal(true)}
                  hoveredPoint={hoveredPoint}
                  setHoveredPoint={setHoveredPoint}
                  onAcknowledgeAlert={(code) => {
                    setAcknowledgedAlerts(prev => ({ ...prev, [code]: true }));
                    triggerToast(`Alert ${code} acknowledged by Operator.`);
                  }}
                  acknowledgedAlerts={acknowledgedAlerts}
                />
              )}

              {activeTab === 'forecast' && (
                <ForecastView 
                  city={currentCity}
                  allCities={currentScopeCities}
                  pollutant={pollutant}
                  setPollutant={setPollutant}
                  timeHorizon={timeHorizon}
                  setTimeHorizon={setTimeHorizon}
                  onExport={handleExportCSV}
                  hoveredPoint={hoveredPoint}
                  setHoveredPoint={setHoveredPoint}
                  onSimulate={() => triggerToast(`Simulating protocol mitigation for ${currentCity.name}: Estimated reduction -18.4 µg/m³.`)}
                />
              )}

              {activeTab === 'map' && (
                <GeoMapView 
                  allCities={currentScopeCities}
                  activeCity={currentCity}
                  onSelectCity={setSelectedCityName}
                  scrubberHour={scrubberHour}
                  setScrubberHour={setScrubberHour}
                  isPlaying={isPlaying}
                  setIsPlaying={setIsPlaying}
                  onSimulate={() => triggerToast(`Simulating dispatch for ${currentCity.name}`)}
                />
              )}

              {activeTab === 'alerts' && (
                <AlertsView 
                  allCities={currentScopeCities}
                  activeCity={currentCity}
                  onSelectCity={setSelectedCityName}
                  acknowledgedAlerts={acknowledgedAlerts}
                  onAcknowledge={(code) => {
                    setAcknowledgedAlerts(prev => ({ ...prev, [code]: true }));
                    triggerToast(`Alert ${code} acknowledged.`);
                  }}
                  onDispatch={(city) => triggerToast(`Emergency curtailment advisory dispatched to ${city.name} municipal command.`)}
                />
              )}

              {activeTab === 'interventions' && (
                <InterventionsView 
                  city={currentCity} 
                  allCities={currentScopeCities}
                  onSimulate={() => triggerToast(`Policy sandbox: Modeled 28.5% mitigation on peak inversion corridor.`)}
                />
              )}

              {activeTab === 'model' && (
                <ModelIntelligenceView city={currentCity} />
              )}
            </main>

            {/* 3. FOOTER */}
            <footer className="h-8 bg-surface-panel border-t border-border-subtle px-3 text-text-muted font-label-sm text-[9px] flex items-center justify-between shrink-0 select-none">
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-1.5">
                  <span className="w-1.5 h-1.5 rounded-full bg-baseline-emerald"></span>
                  <span className="text-text-primary font-semibold">Telemetry Stream Nominal</span>
                  <span>· Synced 42s ago</span>
                </div>
                <span className="text-text-dim">|</span>
                <div>
                  <span>Active Grid: </span>
                  <span className="text-text-primary font-medium">142/146 Continuous BAM-1020 &amp; Optical Units Live</span>
                  <span> · WRF-Chem Assimilated</span>
                </div>
              </div>

    // ==========================================
    // INTERACTIVE SVG CHART COMPONENT
    // ==========================================
    function InteractiveSvgChart({ 
      hourlyData, 
      pollutant, 
      peakHour, 
      peakVal, 
      cpcbCap, 
      severeCap, 
      hoveredPoint, 
      setHoveredPoint 
    }) {
      const width = 1000;
      const height = 300;
      const padLeft = 50;
      const padRight = 30;
      const padTop = 30;
      const padBottom = 40;

      const chartW = width - padLeft - padRight;
      const chartH = height - padTop - padBottom;

      // Find max Y for scaling
      const maxVal = Math.max(180, ...hourlyData.map(h => pollutant === 'pm10' ? h.pm10 : h.p90_upper));
      const minVal = 0;

      const getX = (idx) => padLeft + (idx / Math.max(1, hourlyData.length - 1)) * chartW;
      const getY = (val) => padTop + chartH - ((val - minVal) / (maxVal - minVal)) * chartH;

      // Split into observed (first 14) and forecast (rest)
      const observedCutoff = 14;

      // Build path points
      const points = hourlyData.map((h, i) => ({
        x: getX(i),
        y: getY(pollutant === 'pm10' ? h.pm10 : h.pm25),
        yUpper: getY(h.p90_upper),
        yLower: getY(h.p90_lower),
        data: h,
        index: i
      }));

      // Observed path string
      const obsPoints = points.slice(0, Math.min(points.length, observedCutoff + 1));
      const obsPathD = obsPoints.reduce((acc, p, i) => `${acc} ${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)},${p.y.toFixed(1)}`, "");

      // Forecast path string
      const fcastPoints = points.slice(Math.max(0, observedCutoff));
      const fcastPathD = fcastPoints.reduce((acc, p, i) => `${acc} ${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)},${p.y.toFixed(1)}`, "");

      // P90 Corridor Polygon
      let p90PointsStr = "";
      if (fcastPoints.length > 0) {
        const topEdge = fcastPoints.map(p => `${p.x.toFixed(1)},${p.yUpper.toFixed(1)}`).join(" ");
        const bottomEdge = [...fcastPoints].reverse().map(p => `${p.x.toFixed(1)},${p.yLower.toFixed(1)}`).join(" ");
        p90PointsStr = `${topEdge} ${bottomEdge}`;
      }

      // Severe Cap & CPCB Y
      const ySevere = getY(severeCap);
      const yCpcb = getY(cpcbCap);

      return (
        <div className="relative w-full bg-surface-base rounded p-1 border border-border-subtle/80 overflow-hidden">
          <div className="relative w-full aspect-[22/8] min-h-[220px]">
            <svg 
              className="w-full h-full select-none" 
              viewBox={`0 0 ${width} ${height}`} 
              preserveAspectRatio="none"
            >
              <defs>
                <linearGradient id="p90Grad" x1="0%" x2="0%" y1="0%" y2="100%">
                  <stop offset="0%" stopColor="#00e5ff" stopOpacity="0.22" />
                  <stop offset="100%" stopColor="#06b6d4" stopOpacity="0.03" />
                </linearGradient>
                <linearGradient id="obsGrad" x1="0%" x2="0%" y1="0%" y2="100%">
                  <stop offset="0%" stopColor="#00e5ff" stopOpacity="0.25" />
                  <stop offset="100%" stopColor="#00e5ff" stopOpacity="0.00" />
                </linearGradient>
                <pattern id="diagHatch" width="16" height="16" patternUnits="userSpaceOnUse">
                  <path d="M 0,16 l 16,-16 M -4,4 l 8,-8 M 12,20 l 8,-8" stroke="#1c2027" strokeWidth="0.8" opacity="0.35" />
                </pattern>
              </defs>

              {/* Inversion Window shading */}
              <rect x="520" y={padTop} width="350" height={chartH} fill="url(#diagHatch)" />
              <text x="530" y={padTop + 14} fill="#64748b" fontFamily="JetBrains Mono" fontSize="9" letterSpacing="0.5">
                NOCTURNAL BOUNDARY LAYER DEPRESSION WINDOW
              </text>

              {/* Gridlines */}
              {[30, 60, 90, 120, 150].map(val => {
                const y = getY(val);
                if (y < padTop || y > padTop + chartH) return null;
                const isCpcb = val === cpcbCap;
                const isSevere = val === severeCap;
                return (
                  <g key={val}>
                    <line 
                      x1={padLeft} 
                      x2={width - padRight} 
                      y1={y} 
                      y2={y} 
                      stroke={isSevere ? '#ef4444' : isCpcb ? '#f59e0b' : '#1c2027'} 
                      strokeWidth={isSevere || isCpcb ? 1.2 : 0.8}
                      strokeDasharray={isSevere ? '4,4' : isCpcb ? '5,4' : undefined}
                    />
                    <text 
                      x={padLeft - 8} 
                      y={y + 3} 
                      fill={isSevere ? '#ef4444' : isCpcb ? '#f59e0b' : '#475569'} 
                      fontFamily="JetBrains Mono" 
                      fontSize="9" 
                      textAnchor="end"
                      fontWeight={isSevere || isCpcb ? 700 : 400}
                    >
                      {val}
                    </text>
                  </g>
                );
              })}

              {/* Threshold Labels on right */}
              <text x={width - padRight - 5} y={ySevere - 4} fill="#ef4444" fontFamily="JetBrains Mono" fontSize="8.5" fontWeight="600" textAnchor="end">
                SEVERE CAP ({severeCap} µg/m³)
              </text>
              <text x={width - padRight - 5} y={yCpcb - 4} fill="#f59e0b" fontFamily="JetBrains Mono" fontSize="8.5" fontWeight="600" textAnchor="end">
                CPCB STANDARD ({cpcbCap} µg/m³)
              </text>

              {/* P90 Corridor polygon */}
              {p90PointsStr && (
                <polygon fill="url(#p90Grad)" points={p90PointsStr} />
              )}

              {/* Observed Line */}
              {obsPathD && (
                <path d={obsPathD} fill="none" stroke="#00e5ff" strokeWidth="2.5" />
              )}

              {/* Forecast Dashed Line */}
              {fcastPathD && (
                <path d={fcastPathD} fill="none" stroke="#38bdf8" strokeWidth="2.2" strokeDasharray="5,4" />
              )}

              {/* NOW Marker line at index 14 */}
              {points[observedCutoff] && (
                <g>
                  <line 
                    x1={points[observedCutoff].x} 
                    x2={points[observedCutoff].x} 
                    y1={padTop} 
                    y2={padTop + chartH} 
                    stroke="#00e5ff" 
                    strokeWidth="1.5" 
                    strokeDasharray="3,3" 
                  />
                  <polygon points={`${points[observedCutoff].x - 5},${padTop} ${points[observedCutoff].x + 5},${padTop} ${points[observedCutoff].x},${padTop + 8}`} fill="#00e5ff" />
                  <text x={points[observedCutoff].x} y={padTop - 8} fill="#00e5ff" fontFamily="JetBrains Mono" fontSize="9" fontWeight="700" textAnchor="middle">
                    NOW 14:00
                  </text>
                </g>
              )}

              {/* Data points */}
              {points.map((p, i) => {
                const isObs = i <= observedCutoff;
                const isHovered = hoveredPoint && hoveredPoint.index === i;
                const isPeak = p.data.pm25 === peakVal || p.data.time === peakHour;

                return (
                  <g key={i}>
                    {isPeak && (
                      <circle cx={p.x} cy={p.y} r="8" fill="none" stroke="#ef4444" strokeWidth="1.5" opacity="0.6" className="animate-ping" />
                    )}
                    <circle 
                      cx={p.x} 
                      cy={p.y} 
                      r={isPeak ? 5 : isHovered ? 4.5 : 3} 
                      fill={isPeak ? '#ef4444' : isObs ? '#00e5ff' : '#38bdf8'} 
                      stroke="#090d14" 
                      strokeWidth="1.5"
                      className="cursor-pointer transition-all"
                      onMouseEnter={() => setHoveredPoint(p)}
                      onMouseLeave={() => setHoveredPoint(null)}
                    />
                    {/* X-axis Ticks for even indices */}
                    {i % 3 === 0 && (
                      <text 
                        x={p.x} 
                        y={height - 12} 
                        fill={isPeak ? '#ef4444' : i === observedCutoff ? '#00e5ff' : '#475569'} 
                        fontFamily="JetBrains Mono" 
                        fontSize="9" 
                        fontWeight={isPeak || i === observedCutoff ? 700 : 400}
                        textAnchor="middle"
                      >
                        {p.data.time}
                      </text>
                    )}
                  </g>
                );
              })}
            </svg>

            {/* Interactive Tooltip Overlay */}
            {hoveredPoint && (
              <div 
                className="absolute z-20 bg-surface-card/95 backdrop-blur-md border border-telemetry-cyan text-text-primary p-2 rounded shadow-2xl pointer-events-none font-label-sm text-[11px] transform -translate-x-1/2 -translate-y-full"
                style={{
                  left: `${(hoveredPoint.x / width) * 100}%`,
                  top: `${(hoveredPoint.y / height) * 100 - 8}%`
                }}
              >
                <div className="flex items-center justify-between gap-2 border-b border-border-subtle pb-1 mb-1 font-bold">
                  <span className="text-telemetry-cyan">{hoveredPoint.data.time} IST</span>
                  <span className={`text-[9px] px-1 rounded ${hoveredPoint.data.alert === 'ALERT' ? 'bg-alert-crimson/20 text-alert-crimson' : hoveredPoint.data.alert === 'WATCH' ? 'bg-alert-amber/20 text-alert-amber' : 'bg-baseline-emerald/20 text-baseline-emerald'}`}>
                    {hoveredPoint.data.alert}
                  </span>
                </div>
                <div>PM2.5: <strong className="text-text-primary">{hoveredPoint.data.pm25} µg/m³</strong></div>
                <div>PM10: <span className="text-text-muted">{hoveredPoint.data.pm10} µg/m³</span></div>
                <div className="text-[10px] text-precision-teal">P90: {hoveredPoint.data.p90_lower} – {hoveredPoint.data.p90_upper}</div>
                <div className="text-[9px] text-text-dim mt-0.5 truncate max-w-[160px]">{hoveredPoint.data.suggestions}</div>
              </div>
            )}
          </div>
        </div>
      );
    }

                      <stop offset="0%" stopColor="#F59E0B" stopOpacity="0.75" />
                      <stop offset="50%" stopColor="#06B6D4" stopOpacity="0.25" />

                <div className="flex items-center justify-between text-label-sm text-[10px]">
                  <div className="flex items-center gap-1.5">
                    <span className="w-1.5 h-1.5 rounded-full bg-telemetry-cyan animate-pulse"></span>
                    <span className="text-text-primary font-bold">TEMPORAL DISPERSION SCRUBBER</span>
                  </div>
                  <span className="text-telemetry-cyan font-bold">
                    Hour {scrubberHour}:00 IST ({scrubberHour <= 14 ? 'Ground Truth Observed' : 'Modelled Forecast'})
                  </span>
                </div>

                <div className="flex items-center gap-3">
                  <button 
                    onClick={() => setIsPlaying(!isPlaying)}
                    className="w-7 h-7 rounded bg-telemetry-cyan text-surface-base hover:bg-white flex items-center justify-center font-bold shadow shrink-0"
                  >
                    <span className="material-symbols-outlined text-sm">{isPlaying ? 'pause' : 'play_arrow'}</span>
                  </button>

                  <input 
                    type="range" 
                    min="0" 
                    max="23" 
                    value={scrubberHour} 
                    onChange={(e) => setScrubberHour(Number(e.target.value))}
                    className="w-full accent-telemetry-cyan cursor-pointer"
                  />
                </div>

                <div className="flex justify-between text-[9px] font-label-sm text-text-dim px-1">
                  <span>00:00 (Start)</span>
                  <span className="text-baseline-emerald">08:00 (Morning Peak)</span>
                  <span className="text-telemetry-cyan font-bold">14:00 (NOW)</span>
                  <span className="text-alert-crimson font-bold">20:00 (Evening Inversion)</span>
                  <span>23:00 (+24H)</span>
                </div>
              </div>
            </div>

            {/* RIGHT CONTEXTUAL INTELLIGENCE PANEL (col-span-4) */}
            <div className="col-span-12 xl:col-span-4 space-y-3">
              <div className="bg-surface-card rounded p-3 border border-border-strong shadow-md space-y-3">
                <div className="flex items-center justify-between border-b border-border-subtle pb-1.5">
                  <div className="flex items-center gap-1.5">
                    <span className="material-symbols-outlined text-telemetry-cyan text-sm">location_city</span>
                    <h2 className="font-headline-sm text-xs text-text-primary font-bold">
                      {activeCity.name.toUpperCase()} STATION TELEMETRY
                    </h2>
                  </div>
                  <span className={`px-1.5 py-0.2 rounded font-label-sm text-[9px] font-bold uppercase ${
                    activeCity.primary_alert === 'ALERT' ? 'bg-alert-crimson/20 text-alert-crimson' : 'bg-alert-amber/20 text-alert-amber'
                  }`}>
                    {activeCity.primary_alert}
                  </span>
                </div>

                {/* Current Coordinates & Details */}
                <div className="space-y-1 text-xs font-body-sm text-text-muted">
                  <div className="flex justify-between">
                    <span>Coordinates:</span>
                    <span className="font-label-sm text-text-primary">{activeCity.lat}° N, {activeCity.lng}° E</span>
                  </div>
                  <div className="flex justify-between">
                    <span>Basin:</span>
                    <span className="text-text-primary truncate ml-2">{activeCity.basin}</span>
                  </div>
                  <div className="flex justify-between">
                    <span>Population Exposed:</span>
                    <span className="text-telemetry-cyan font-semibold">{activeCity.population}</span>
                  </div>
                </div>

                {/* Real-time reading at scrubbed hour */}
                <div className="p-2.5 bg-surface-base rounded border border-border-subtle flex items-center justify-between">
                  <div>
                    <span className="font-label-sm text-[9px] text-text-muted block">
                      READING @ {String(scrubberHour).padStart(2, '0')}:00 IST
                    </span>
                    <div className="flex items-baseline gap-1 mt-0.5">
                      <span className="font-telemetry-metric text-2xl text-alert-crimson font-bold">
                        {fmt(activeCity.hourly[scrubberHour]?.pm25 || activeCity.current_pm25)}
                      </span>
                      <span className="font-label-sm text-xs text-text-dim">µg/m³ PM2.5</span>
                    </div>
                  </div>
                  <div className="text-right font-label-sm text-[10px]">
                    <span className="text-text-muted block">PM10: {fmt(activeCity.hourly[scrubberHour]?.pm10 || activeCity.current_pm10)} µg/m³</span>
                    <span className="text-alert-amber font-semibold">{activeCity.hourly[scrubberHour]?.cat || 'Moderate'}</span>
                  </div>
                </div>

                {/* AI Recommendation */}
                <div className="p-2 bg-surface-panel rounded border border-border-subtle space-y-1">
                  <span className="font-label-sm text-[9px] text-telemetry-cyan uppercase font-bold">
                    RECOMMENDED DISPATCH PROTOCOL:
                  </span>
                  <p className="font-body-sm text-xs text-text-primary leading-tight">
                    {activeCity.primary_suggestion}
                  </p>
                </div>

                <button 
                  onClick={onSimulate}
                  className="w-full py-2 bg-telemetry-cyan hover:bg-white text-surface-base font-label-sm text-xs font-bold rounded shadow transition-all"
                >
                  DISPATCH INTERVENTION FOR {activeCity.name.toUpperCase()}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // VIEW 4: ALERTS CENTER VIEW
    // ==========================================
    function AlertsView({ 
      allCities, 
      activeCity, 
      onSelectCity, 
      acknowledgedAlerts, 
      onAcknowledge, 
      onDispatch 
    }) {
      const [filter, setFilter] = useState('all'); // 'all', 'ALERT', 'WATCH'

      // Collect all alerts from all cities
      const alertItems = useMemo(() => {
        const list = [];
        Object.values(allCities).forEach(c => {
          if (c.primary_alert === 'ALERT' || c.primary_alert === 'WATCH') {
            list.push({
              id: `ALT-${c.name.slice(0,3).toUpperCase()}-24H`,
              city: c,
              type: c.primary_alert,
              peak: c.peak_pm25,
              peakHour: c.peak_hour,
              exceedHours: c.exceed_hours,
              message: `${c.name} atmospheric PM2.5 forecast peak of ${fmt(c.peak_pm25)} µg/m³ at ${c.peak_hour} IST exceeds CPCB ceiling.`,
              action: c.primary_suggestion
            });
          }
        });
        return list.sort((a, b) => b.peak - a.peak);
      }, [allCities]);

      const filteredAlerts = useMemo(() => {
        if (filter === 'all') return alertItems;
        return alertItems.filter(a => a.type === filter);
      }, [alertItems, filter]);

      return (
        <div className="space-y-3">
          {/* Header Banner */}
          <section className="bg-surface-panel px-3 py-2 rounded border border-border-subtle flex flex-wrap items-center justify-between gap-2">
            <div>
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-alert-crimson animate-pulse"></span>
                <h1 className="font-headline-md text-sm text-text-primary tracking-tight font-bold uppercase">
                  AIR QUALITY INCIDENT &amp; ALERT CENTER
                </h1>
                <span className="px-1.5 py-0.2 rounded bg-surface-card text-telemetry-cyan font-label-sm text-[9px] uppercase">
                  PINN v4.2.1 ACTIVE
                </span>
              </div>
              <p className="font-body-sm text-xs text-text-muted mt-0.5">
                Proactive pollution incident triage generated from continuous BAM-1020 ground truth telemetry.
              </p>
            </div>

            {/* Filter Buttons */}
            <div className="flex items-center gap-1 bg-surface-base p-1 rounded border border-border-subtle text-label-sm text-[10px]">
              <button 
                onClick={() => setFilter('all')}
                className={`px-2 py-0.5 rounded font-bold ${filter === 'all' ? 'bg-surface-card text-telemetry-cyan' : 'text-text-muted'}`}
              >
                ALL ({alertItems.length})
              </button>
              <button 
                onClick={() => setFilter('ALERT')}
                className={`px-2 py-0.5 rounded font-bold ${filter === 'ALERT' ? 'bg-alert-crimson/20 text-alert-crimson' : 'text-text-muted'}`}
              >
                CRITICAL ONLY
              </button>
              <button 
                onClick={() => setFilter('WATCH')}
                className={`px-2 py-0.5 rounded font-bold ${filter === 'WATCH' ? 'bg-alert-amber/20 text-alert-amber' : 'text-text-muted'}`}
              >
                WATCH ONLY
              </button>
            </div>
          </section>

          {/* Incident Cards Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">
            {filteredAlerts.map(alt => {
              const isAck = acknowledgedAlerts[alt.id];
              const isCrit = alt.type === 'ALERT';

              return (
                <div 
                  key={alt.id}
                  className={`p-3 rounded border transition-all flex flex-col justify-between space-y-2 ${
                    isCrit ? 'bg-surface-card border-alert-crimson/30 hover:border-alert-crimson' : 'bg-surface-card border-alert-amber/30 hover:border-alert-amber'
                  }`}
                >
                  <div>
                    <div className="flex items-center justify-between border-b border-border-subtle/50 pb-1.5">
                      <div className="flex items-center gap-1.5">
                        <span className={`w-2 h-2 rounded-full ${isCrit ? 'bg-alert-crimson animate-ping' : 'bg-alert-amber'}`}></span>
                        <span className="font-headline-sm text-xs text-text-primary font-bold">{alt.city.name}</span>
                        <span className="text-[10px] font-label-sm text-text-dim">({alt.city.state})</span>
                      </div>
                      <span className={`px-1.5 py-0.2 rounded font-label-sm text-[9px] font-bold uppercase ${
                        isCrit ? 'bg-alert-crimson/20 text-alert-crimson' : 'bg-alert-amber/20 text-alert-amber'
                      }`}>
                        {alt.type}
                      </span>
                    </div>

                    <p className="font-body-sm text-xs text-text-primary mt-2 leading-relaxed">
                      {alt.message}
                    </p>

                    <div className="mt-2 p-2 bg-surface-panel rounded border border-border-subtle text-[11px] font-body-sm space-y-1">
                      <div className="flex justify-between">
                        <span className="text-text-muted">Target Mitigation Action:</span>
                        <span className="text-telemetry-cyan font-bold">{alt.action}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-text-muted">Peak Horizon:</span>
                        <span className="text-text-primary font-semibold">{alt.peakHour} IST ({alt.exceedHours}h above ceiling)</span>
                      </div>
                    </div>
                  </div>

                  <div className="flex items-center justify-between pt-1 border-t border-border-subtle/50 font-label-sm text-xs">
                    <button 
                      onClick={() => onAcknowledge(alt.id)}
                      className={`px-3 py-1 rounded font-bold transition-all ${
                        isAck ? 'bg-surface-container text-text-dim' : 'bg-alert-crimson text-surface-base hover:bg-alert-crimson/80'
                      }`}
                    >
                      {isAck ? '✓ Acknowledged' : 'Acknowledge Incident'}
                    </button>
                    <button 
                      onClick={() => onDispatch(alt.city)}
                      className="px-3 py-1 bg-surface-panel hover:bg-surface-container-high border border-border-strong rounded text-text-primary font-semibold"
                    >
                      Dispatch Protocol →
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ==========================================
    // VIEW 5: INTERVENTIONS VIEW
    // ==========================================
    function InterventionsView({ city, allCities, onSimulate }) {
      return (
        <div className="space-y-3">
          <div className="bg-surface-panel p-2.5 rounded border border-border-subtle">
            <h1 className="font-headline-md text-sm text-text-primary font-bold uppercase">
              INTERVENTION GOVERNANCE &amp; POLICY SANDBOX
            </h1>
            <p className="font-body-sm text-xs text-text-muted mt-0.5">
              Simulate and enforce municipal emission curtailment protocols for urban and industrial sectors.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
            {[
              { code: "EPS-01", name: "Roadway Dust Misting", status: "COMPLETED", reduction: "-4.2 µg/m³", desc: "Deploy high-pressure mist cannons along primary commercial corridors during morning hours." },
              { code: "EPS-02", name: "Heavy Metallurgy Curtailment", status: "IN EFFECT", reduction: "-8.5 µg/m³", desc: "Temporarily enforce 30% kiln output restriction for Peenya and NCR metallurgy clusters." },
              { code: "EPS-04", name: "Arterial Transit Freight Diversion", status: "ACTIVE DISPATCH", reduction: "-18.4 µg/m³", desc: "Re-route commercial heavy diesel transit around bypass ring roads from 18:00 to 22:30 IST." }
            ].map(item => (
              <div key={item.code} className="bg-surface-card p-3 rounded border border-border-subtle space-y-2 flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between pb-1 border-b border-border-subtle">
                    <span className="font-label-sm text-xs font-bold text-telemetry-cyan">{item.code}</span>
                    <span className="px-1.5 py-0.2 rounded font-label-sm text-[9px] bg-baseline-emerald/20 text-baseline-emerald font-bold">
                      {item.status}
                    </span>
                  </div>
                  <h3 className="font-headline-sm text-xs text-text-primary font-bold mt-1">{item.name}</h3>
                  <p className="font-body-sm text-xs text-text-muted mt-1 leading-relaxed">{item.desc}</p>
                </div>
                <div className="pt-2 border-t border-border-subtle/50 flex items-center justify-between font-label-sm text-xs">
                  <span className="text-baseline-emerald font-bold">{item.reduction}</span>
                  <button onClick={onSimulate} className="text-telemetry-cyan hover:underline">
                    Simulate →
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ==========================================
    // VIEW 6: MODEL INTELLIGENCE VIEW
    // ==========================================
    function ModelIntelligenceView({ city }) {
      return (
        <div className="space-y-3">
          <div className="bg-surface-panel p-2.5 rounded border border-border-subtle">
            <h1 className="font-headline-md text-sm text-text-primary font-bold uppercase">
              MODEL ARCHITECTURE &amp; DEEPDISPERSION PINN
            </h1>
            <p className="font-body-sm text-xs text-text-muted mt-0.5">
              Physics-Informed Neural Network (PINN) assimilating advection-diffusion PDEs with WRF-Chem atmospheric models.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div className="bg-surface-card p-3 rounded border border-border-subtle space-y-2">
              <h3 className="font-headline-sm text-xs text-text-primary font-bold">PINN Loss Function Formulation</h3>
              <p className="font-body-sm text-xs text-text-muted leading-relaxed">
                The DeepDispersion architecture minimizes a composite loss function penalizing both ground truth BAM-1020 sensor deviations and boundary layer transport PDE residuals:
              </p>
              <div className="p-2.5 bg-surface-base rounded border border-border-subtle font-label-sm text-xs text-telemetry-cyan">
                L_total = L_data(y_obs, y_pred) + λ * L_physics(∂c/∂t + u·∇c - ∇·(K∇c) - S)
              </div>
              <ul className="text-xs space-y-1 text-text-muted font-body-sm">
                <li>• <strong className="text-text-primary">∂c/∂t</strong>: Temporal concentration gradient</li>
                <li>• <strong className="text-text-primary">u·∇c</strong>: 3D advective transport by wind field (1.8 m/s NW)</li>
                <li>• <strong className="text-text-primary">K∇c</strong>: Atmospheric turbulent eddy diffusivity</li>
                <li>• <strong className="text-text-primary">S</strong>: Point and area emission inventory source terms</li>
              </ul>
            </div>

            <div className="bg-surface-card p-3 rounded border border-border-subtle space-y-2">
              <h3 className="font-headline-sm text-xs text-text-primary font-bold">Bayesian Uncertainty Quantitation (UQ)</h3>
              <p className="font-body-sm text-xs text-text-muted leading-relaxed">
                Posterior probability distributions are approximated via Monte Carlo Dropout across 120 forward ensembles:
              </p>
              <div className="space-y-1.5 font-label-sm text-xs">
                <div className="flex justify-between p-2 bg-surface-base rounded border border-border-subtle">
                  <span className="text-text-muted">P90 Posterior Coverage:</span>
                  <span className="text-baseline-emerald font-bold">89.4% (Target: 90%)</span>
                </div>
                <div className="flex justify-between p-2 bg-surface-base rounded border border-border-subtle">
                  <span className="text-text-muted">Mean Absolute Error (MAE):</span>
                  <span className="text-telemetry-cyan font-bold">±4.8 µg/m³</span>
                </div>
                <div className="flex justify-between p-2 bg-surface-base rounded border border-border-subtle">
                  <span className="text-text-muted">Sensor Cross-Validation:</span>
                  <span className="text-text-primary font-bold">R² = 0.924</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
